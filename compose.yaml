services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_USER: enterpriseiq
      POSTGRES_DB: enterpriseiq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - enterpriseiq_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enterpriseiq -d enterpriseiq"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  enterpriseiq_pg:
